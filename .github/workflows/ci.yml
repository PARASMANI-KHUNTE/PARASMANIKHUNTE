name: CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Verify SSR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build and Static SSR Prerender
        run: npm run build

  trigger-render-deploy:
    name: Trigger Render Deploy Hook (Optional)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Call Render Deploy Hook if configured
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "🚀 Triggering Render Deploy Hook..."
            curl -s -X POST "$DEPLOY_HOOK"
            echo "✅ Deploy hook triggered."
          else
            echo "ℹ️ RENDER_DEPLOY_HOOK_URL secret not set. Render will deploy automatically via its GitHub integration if Auto-Deploy is enabled."
          fi
